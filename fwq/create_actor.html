<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>怪物国度 - 创建角色</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;user-select:none;}
body{
    font-family:'Microsoft YaHei','PingFang SC',sans-serif;
    background:linear-gradient(135deg,#0a0a1a 0%,#1a1a3e 30%,#0f1f3f 60%,#0a0a1a 100%);
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    overflow:hidden;position:relative;
}
body::before{
    content:'';position:fixed;top:0;left:0;right:0;bottom:0;
    background:radial-gradient(ellipse at 30% 20%,rgba(60,120,255,0.08) 0%,transparent 50%),
               radial-gradient(ellipse at 70% 80%,rgba(180,60,255,0.06) 0%,transparent 50%);
    pointer-events:none;
}
/* Floating particles */
.particles{position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;overflow:hidden;}
.particle{
    position:absolute;width:4px;height:4px;background:rgba(100,180,255,0.4);
    border-radius:50%;animation:floatUp linear infinite;
}
@keyframes floatUp{
    0%{transform:translateY(100vh) scale(0);opacity:0;}
    20%{opacity:1;}
    80%{opacity:0.6;}
    100%{transform:translateY(-10vh) scale(1);opacity:0;}
}
.card{
    position:relative;z-index:1;
    width:520px;max-width:94vw;
    background:linear-gradient(145deg,rgba(20,25,50,0.95),rgba(15,20,40,0.92));
    border:1px solid rgba(100,150,255,0.2);
    border-radius:20px;padding:40px 36px 32px;
    box-shadow:0 20px 60px rgba(0,0,0,0.6),inset 0 1px 0 rgba(100,150,255,0.1);
    backdrop-filter:blur(20px);
}
.logo{
    text-align:center;margin-bottom:28px;
}
.logo h1{
    font-size:28px;font-weight:700;
    background:linear-gradient(135deg,#6eb4ff,#a78bfa,#6eb4ff);
    background-size:200% 200%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;
    background-clip:text;letter-spacing:4px;
    animation:gradientShift 3s ease infinite;
}
@keyframes gradientShift{0%,100%{background-position:0% 50%;}50%{background-position:100% 50%;}}
.logo p{
    color:rgba(180,200,255,0.5);font-size:13px;letter-spacing:6px;margin-top:4px;
}
/* Section toggle */
.section{display:none;}
.section.active{display:block;}
/* Tabs */
.tabs{display:flex;gap:8px;margin-bottom:24px;}
.tab{
    flex:1;padding:10px;text-align:center;border-radius:10px;
    font-size:14px;cursor:pointer;transition:all 0.3s;
    color:rgba(180,200,255,0.5);background:rgba(255,255,255,0.03);
    border:1px solid rgba(255,255,255,0.05);
}
.tab:hover{color:rgba(180,200,255,0.8);background:rgba(255,255,255,0.06);}
.tab.active{color:#fff;background:rgba(60,120,255,0.15);border-color:rgba(60,120,255,0.3);}
/* Form */
.form-group{margin-bottom:18px;}
.form-group label{
    display:block;font-size:13px;color:rgba(180,200,255,0.7);margin-bottom:6px;letter-spacing:1px;
}
.form-group input{
    width:100%;padding:12px 16px;border-radius:10px;border:1px solid rgba(100,150,255,0.15);
    background:rgba(255,255,255,0.04);color:#e0e8ff;font-size:15px;
    outline:none;transition:all 0.3s;
}
.form-group input:focus{border-color:rgba(100,150,255,0.4);background:rgba(255,255,255,0.07);box-shadow:0 0 20px rgba(60,120,255,0.1);}
.form-group input::placeholder{color:rgba(180,200,255,0.2);}
/* Gender selector */
.gender-selector{display:flex;gap:16px;margin-bottom:20px;}
.gender-option{
    flex:1;padding:16px;border-radius:14px;cursor:pointer;text-align:center;
    border:2px solid rgba(100,150,255,0.1);background:rgba(255,255,255,0.02);
    transition:all 0.3s;position:relative;overflow:hidden;
}
.gender-option:hover{border-color:rgba(100,150,255,0.25);background:rgba(255,255,255,0.05);}
.gender-option.selected{border-color:rgba(100,180,255,0.5);background:rgba(60,120,255,0.1);}
.gender-option .gender-icon{
    font-size:40px;display:block;margin-bottom:6px;filter:grayscale(0.5);transition:all 0.3s;
}
.gender-option.selected .gender-icon{filter:grayscale(0);transform:scale(1.1);}
.gender-option .gender-label{font-size:15px;color:rgba(180,200,255,0.7);transition:color 0.3s;}
.gender-option.selected .gender-label{color:#fff;font-weight:600;}
.gender-option .gender-check{
    position:absolute;top:8px;right:8px;width:20px;height:20px;border-radius:50%;
    border:2px solid rgba(100,150,255,0.2);display:none;align-items:center;justify-content:center;
}
.gender-option.selected .gender-check{display:flex;background:rgba(60,120,255,0.3);border-color:rgba(100,180,255,0.5);}
.gender-option.selected .gender-check::after{content:'✓';color:#6eb4ff;font-size:12px;font-weight:bold;}
/* Gender icon specific */
.gender-male .gender-icon{
    background:linear-gradient(135deg,#4a90d9,#357abd);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;
    background-clip:text;
}
.gender-female .gender-icon{
    background:linear-gradient(135deg,#e87d9e,#d4607a);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;
    background-clip:text;
}
/* Button */
.btn{
    width:100%;padding:14px;border-radius:12px;border:none;font-size:16px;font-weight:600;
    cursor:pointer;transition:all 0.3s;letter-spacing:2px;position:relative;overflow:hidden;
}
.btn-primary{
    background:linear-gradient(135deg,#4a90d9,#6c5ce7);
    color:#fff;box-shadow:0 4px 20px rgba(74,144,217,0.3);
}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 6px 30px rgba(74,144,217,0.4);}
.btn-primary:active{transform:translateY(0);}
.btn-primary:disabled{opacity:0.4;cursor:not-allowed;transform:none;}
.btn-secondary{
    background:rgba(255,255,255,0.05);color:rgba(180,200,255,0.7);
    border:1px solid rgba(100,150,255,0.15);margin-top:10px;
}
.btn-secondary:hover{background:rgba(255,255,255,0.08);color:#fff;}
/* Error/Success message */
.msg{padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:14px;display:none;text-align:center;}
.msg.error{display:block;background:rgba(255,60,60,0.1);border:1px solid rgba(255,60,60,0.2);color:#ff6b6b;}
.msg.success{display:block;background:rgba(60,200,100,0.1);border:1px solid rgba(60,200,100,0.2);color:#5ceb8a;}
.msg.info{display:block;background:rgba(60,120,255,0.1);border:1px solid rgba(60,120,255,0.2);color:#6eb4ff;}
/* Loading spinner */
.spinner{
    display:inline-block;width:18px;height:18px;border:2px solid rgba(255,255,255,0.2);
    border-top-color:#fff;border-radius:50%;animation:spin 0.6s linear infinite;
    vertical-align:middle;margin-right:6px;
}
@keyframes spin{to{transform:rotate(360deg);}}
/* Server status */
.server-status{
    text-align:center;margin-top:16px;font-size:12px;
    color:rgba(180,200,255,0.3);letter-spacing:1px;
}
.server-status .dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:4px;vertical-align:middle;}
.server-status .dot.online{background:#5ceb8a;box-shadow:0 0 6px rgba(92,235,138,0.5);}
.server-status .dot.offline{background:#ff6b6b;box-shadow:0 0 6px rgba(255,60,60,0.5);}
/* Logged-in account bar */
.logged-in-bar{
    display:flex;align-items:center;gap:8px;
    padding:8px 14px;border-radius:10px;
    background:linear-gradient(135deg,rgba(60,180,100,0.12),rgba(60,120,255,0.08));
    border:1px solid rgba(60,180,100,0.2);
    margin-bottom:16px;font-size:13px;
    animation:fadeIn 0.3s ease;
}
@keyframes fadeIn{from{opacity:0;transform:translateY(-8px);}to{opacity:1;transform:translateY(0);}}
.logged-in-icon{font-size:16px;}
.logged-in-bar .logged-in-account{color:#5ceb8a;font-weight:600;flex:1;}
.logged-in-bar .logged-in-status{color:rgba(180,200,255,0.5);font-size:12px;}
.logged-in-logout{
    padding:3px 10px;border-radius:6px;border:1px solid rgba(255,60,60,0.3);
    background:rgba(255,60,60,0.1);color:#ff6b6b;font-size:11px;cursor:pointer;transition:all 0.3s;
}
.logged-in-logout:hover{background:rgba(255,60,60,0.2);}
/* Already logged in info */
.user-info{
    display:flex;align-items:center;justify-content:space-between;
    padding:10px 14px;border-radius:8px;background:rgba(60,120,255,0.08);
    border:1px solid rgba(60,120,255,0.15);margin-bottom:18px;
}
.user-info span{color:rgba(180,200,255,0.8);font-size:13px;}
.user-info button{
    padding:4px 12px;border-radius:6px;border:1px solid rgba(255,60,60,0.3);
    background:rgba(255,60,60,0.1);color:#ff6b6b;font-size:12px;cursor:pointer;transition:all 0.3s;
}
.user-info button:hover{background:rgba(255,60,60,0.2);}
/* Avatar preview */
.avatar-preview{
    width:80px;height:80px;border-radius:50%;margin:0 auto 10px;
    background:rgba(255,255,255,0.05);border:2px solid rgba(100,150,255,0.1);
    display:flex;align-items:center;justify-content:center;font-size:36px;
    transition:all 0.3s;
}
.gender-option.selected .avatar-preview{border-color:rgba(100,180,255,0.4);}
.avatar-preview.male{color:#4a90d9;}
.avatar-preview.female{color:#e87d9e;}
/* Divider */
.divider{
    display:flex;align-items:center;margin:16px 0;color:rgba(180,200,255,0.2);font-size:12px;gap:12px;
}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:rgba(100,150,255,0.1);}
/* Responsive */
@media(max-width:500px){
    .card{padding:24px 18px;border-radius:14px;}
    .logo h1{font-size:22px;}
    .gender-selector{gap:10px;}
    .gender-option{padding:12px 8px;}
    .gender-option .gender-icon{font-size:32px;}
}
</style>
</head>
<body>

<div class="particles" id="particles"></div>

<div class="card">
    <div class="logo">
        <h1>怪物国度</h1>
        <p>MONSTER KINGDOM</p>
    </div>

    <!-- Error/Success Message -->
    <div id="message" class="msg"></div>

    <!-- Logged-in account bar (hidden until login) -->
    <div id="loggedInBar" class="logged-in-bar" style="display:none;">
        <span class="logged-in-icon">👤</span>
        <span id="loggedInAccount">已登录: </span>
        <span class="logged-in-status" id="loggedInStatus">账号已绑定</span>
        <button class="logged-in-logout" onclick="handleLogout()">切换账号</button>
    </div>

    <!-- ========== LOGIN SECTION ========== -->
    <div id="loginSection" class="section active">
        <div class="tabs">
            <div class="tab active" data-tab="loginTab">登录</div>
            <div class="tab" data-tab="registerTab">注册</div>
        </div>

        <!-- Login Form -->
        <div id="loginTab" class="section active">
            <div class="form-group">
                <label>用户名</label>
                <input type="text" id="loginUsername" placeholder="请输入用户名" maxlength="20" autocomplete="username">
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" id="loginPassword" placeholder="请输入密码" maxlength="32" autocomplete="current-password">
            </div>
            <button class="btn btn-primary" id="loginBtn" onclick="handleLogin()">登 录</button>
            <button class="btn btn-secondary" onclick="switchTab('registerTab')">没有账号？点此注册</button>
            <div class="divider">或</div>
            <button class="btn btn-secondary" onclick="skipLogin()">离线游玩（跳过登录）</button>
        </div>

        <!-- Register Form -->
        <div id="registerTab" class="section">
            <div class="form-group">
                <label>用户名</label>
                <input type="text" id="regUsername" placeholder="请输入用户名" maxlength="20" autocomplete="username">
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" id="regPassword" placeholder="请输入密码" maxlength="32" autocomplete="new-password">
            </div>
            <div class="form-group">
                <label>确认密码</label>
                <input type="password" id="regConfirm" placeholder="再次输入密码" maxlength="32" autocomplete="new-password">
            </div>
            <button class="btn btn-primary" id="registerBtn" onclick="handleRegister()">注 册</button>
            <button class="btn btn-secondary" onclick="switchTab('loginTab')">已有账号？点此登录</button>
        </div>
    </div>

    <!-- ========== CHARACTER CREATION SECTION ========== -->
    <div id="createSection" class="section">
        <div class="user-info" id="userInfo">
            <span id="loggedInUser"></span>
            <button onclick="handleLogout()">退出登录</button>
        </div>

        <div class="form-group">
            <label>选择性别</label>
        </div>
        <div class="gender-selector">
            <div class="gender-option gender-male" data-gender="male" onclick="selectGender(this)">
                <div class="avatar-preview male">&#9794;</div>
                <span class="gender-icon">&#9794;</span>
                <span class="gender-label">男</span>
                <div class="gender-check"></div>
            </div>
            <div class="gender-option gender-female" data-gender="female" onclick="selectGender(this)">
                <div class="avatar-preview female">&#9792;</div>
                <span class="gender-icon">&#9792;</span>
                <span class="gender-label">女</span>
                <div class="gender-check"></div>
            </div>
        </div>

        <div class="form-group">
            <label>角色名字</label>
            <div style="display:flex;gap:8px;">
                <input type="text" id="characterName" placeholder="输入你的角色名字" maxlength="8" style="flex:1;">
                <button id="randomNameBtn" onclick="fillRandomName()" type="button" style="
                    padding:8px 14px;border-radius:8px;border:1px solid rgba(100,150,255,0.25);
                    background:linear-gradient(135deg,rgba(60,120,255,0.15),rgba(160,80,255,0.12));
                    color:#8ab4ff;font-size:13px;cursor:pointer;transition:all 0.3s;white-space:nowrap;
                    font-family:inherit;letter-spacing:1px;
                " onmouseover="this.style.borderColor='rgba(100,150,255,0.5)';this.style.background='linear-gradient(135deg,rgba(60,120,255,0.25),rgba(160,80,255,0.2))'" onmouseout="this.style.borderColor='rgba(100,150,255,0.25)';this.style.background='linear-gradient(135deg,rgba(60,120,255,0.15),rgba(160,80,255,0.12))'">&#x1F3B2; 随机</button>
            </div>
        </div>

        <button class="btn btn-primary" id="startBtn" onclick="handleCreateCharacter()">开始游戏</button>
    </div>

    <div class="server-status">
        <span class="dot" id="serverDot"></span>
        <span id="serverText">连接服务器中...</span>
    </div>
</div>

<script>
// ========= Configuration =========
// 服务器地址（部署时请修改为实际服务器地址）
var API_URL = '/api.php';
var STORAGE_KEY_NAME = 'mk_charactername';
var STORAGE_KEY_GENDER = 'mk_gender';
var STORAGE_KEY_TOKEN = 'mk_token';
var STORAGE_KEY_USERNAME = 'mk_username';

// ========= Random Name Generator =========
// 如果 RandomNameGenerator 未定义（脚本未加载），使用内置简化版
if (typeof RandomNameGenerator === 'undefined') {
    var RandomNameGenerator = (function() {
        var SUR = ['李','林','叶','萧','楚','苏','白','夜','星','月','风','云','龙','玄','灵','雪','霜','寒','冰','炎','雷','电','尘','烟','影','幽','冥','天','辰','洛','顾','沈','江','秦','唐','宋','宁','柳','韩','张','王','赵','刘'];
        var SUR2 = ['慕容','欧阳','司徒','上官','司马','南宫','夏侯','诸葛','独孤','令狐','百里','北辰','凌霄','星辰','明月','夜风','紫月','青霜','清风'];
        var G1 = ['寒','霜','雪','冰','炎','烈','雷','电','风','云','月','星','尘','烟','影','幽','灵','幻','玄','羽','空','冥','渊','辰','曦','瑶','汐','岚','薇','瑾','瑜','弦','琴','剑','萧','歌','舞','玉','清','飞','落','晓','暮','梦','晴','柔','雅','萱','紫','嫣','婷','宁','静'];
        var G2 = ['无痕','无情','绝影','凌天','傲天','苍穹','碧落','星辰','明月','清风','流云','飞雪','寒霜','烈焰','疾风','雷鸣','烟雨','红尘','白衣','青云','逸尘','若曦','雨薇','梦瑶','雪琪','云岚','冰凝','诗涵','紫嫣','雨桐','语嫣','若雪','倾城','千寻','百川','万钧','九霄','三生','七夜'];
        function pick(a){return a[Math.floor(Math.random()*a.length)];}
        function gen(minLen,maxLen){
            if(minLen===undefined)minLen=2;if(maxLen===undefined)maxLen=8;
            for(var a=0;a<50;a++){
                var n='';
                if(Math.random()<0.8){n+=Math.random()<0.3?pick(SUR2):pick(SUR);}
                var c=1+Math.floor(Math.random()*3);
                for(var i=0;i<c;i++){n+=Math.random()<0.5?pick(G2):pick(G1);}
                if(n.length>=minLen&&n.length<=maxLen)return n;
            }
            return pick(G1)+pick(G1);
        }
        return {generate:gen, generateMultiple:function(cnt,mn,mx){var r=[];for(var i=0;i<cnt;i++){r.push(gen(mn,mx));}return r;}};
    })();
    console.log('[创建角色] 随机名称生成器已加载（内置版）');
} else {
    console.log('[创建角色] 随机名称生成器已加载（完整版）');
}

/** 填充随机名字 */
function fillRandomName() {
    var input = document.getElementById('characterName');
    var name = RandomNameGenerator.generate(2, 8);
    input.value = name;
    // 闪烁反馈
    input.style.borderColor = 'rgba(100,200,100,0.6)';
    input.style.background = 'rgba(100,200,100,0.08)';
    setTimeout(function(){
        input.style.borderColor = '';
        input.style.background = '';
    }, 600);
}

// ========= Utility =========
function showMsg(text, type) {
    var el = document.getElementById('message');
    el.textContent = text;
    el.className = 'msg ' + (type || '');
}

function hideMsg() {
    document.getElementById('message').className = 'msg';
}

function setLoading(btnId, loading) {
    var btn = document.getElementById(btnId);
    if (loading) {
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner"></span> 处理中...';
    } else {
        btn.disabled = false;
        btn.innerHTML = btnId === 'loginBtn' ? '登 录' : btnId === 'registerBtn' ? '注 册' : '开始游戏';
    }
}

// ========= Tab Switching =========
function switchTab(tabId) {
    document.querySelectorAll('.tabs .tab').forEach(function(t){t.classList.remove('active');});
    document.querySelectorAll('.section').forEach(function(s){s.classList.remove('active');});
    var tab = document.querySelector('.tab[data-tab="' + tabId + '"]');
    if (tab) tab.classList.add('active');
    document.getElementById(tabId).classList.add('active');
    hideMsg();
}

document.querySelectorAll('.tabs .tab').forEach(function(tab) {
    tab.addEventListener('click', function() {
        switchTab(this.getAttribute('data-tab'));
    });
});

// ========= Gender Selection =========
var selectedGender = null;
function selectGender(el) {
    document.querySelectorAll('.gender-option').forEach(function(g){g.classList.remove('selected');});
    el.classList.add('selected');
    selectedGender = el.getAttribute('data-gender');
}

// ========= Server Status =========
function checkServer() {
    var dot = document.getElementById('serverDot');
    var text = document.getElementById('serverText');
    fetch(API_URL + '?action=serverStatus', {method:'POST',timeout:5000})
    .then(function(r){return r.json();})
    .then(function(data){
        if (data.code === 200) {
            dot.className = 'dot online';
            text.textContent = '服务器在线';
        } else {
            dot.className = 'dot online';
            text.textContent = '服务器连接正常';
        }
    }).catch(function(){
        dot.className = 'dot offline';
        text.textContent = '服务器离线（本地模式）';
    });
}

// ========= Login =========
function handleLogin() {
    var username = document.getElementById('loginUsername').value.trim();
    var password = document.getElementById('loginPassword').value.trim();
    if (!username) { showMsg('请输入用户名', 'error'); return; }
    if (!password) { showMsg('请输入密码', 'error'); return; }
    hideMsg();
    setLoading('loginBtn', true);

    fetch(API_URL + '?action=login', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({username:username, password:password})
    })
    .then(function(r){return r.json();})
    .then(function(result){
        setLoading('loginBtn', false);
        if (result.code === 200 && result.data && result.data.user) {
            var token = result.data.user.token;
            localStorage.setItem(STORAGE_KEY_TOKEN, token);
            localStorage.setItem(STORAGE_KEY_USERNAME, result.data.user.username);
            // 显示已登录账号提示
            showLoggedInBar(result.data.user.username);
            showMsg('登录成功！', 'success');
            // 检查服务器上此账号是否已有角色
            fetch(API_URL + '?action=checkCharacter', {
                method: 'POST',
                headers: {'Content-Type':'application/json'},
                body: JSON.stringify({token: token})
            })
            .then(function(r){return r.json();})
            .then(function(charResult){
                if (charResult.code === 200 && charResult.data && charResult.data.hasCharacter) {
                    // 已有角色，直接进入游戏（通知父窗口）
                    var existingName = charResult.data.characterName || result.data.user.username;
                    localStorage.setItem(STORAGE_KEY_NAME, existingName);
                    showMsg('已有角色「' + existingName + '」，正在进入游戏...', 'success');
                    setTimeout(function() {
                        notifyGameComplete(existingName, 'male');
                    }, 1000);
                } else if (charResult.code === 401) {
                    // Token过期或被服务器清除，回到登录界面
                    localStorage.removeItem(STORAGE_KEY_TOKEN);
                    localStorage.removeItem(STORAGE_KEY_USERNAME);
                    hideLoggedInBar();
                    showMsg('登录已过期，请重新登录', 'error');
                } else {
                    // 无角色，显示创建界面
                    setTimeout(enterCreateSection, 600);
                }
            })
            .catch(function(){
                // 网络请求失败，尝试读取本地角色名
                var localName = localStorage.getItem(STORAGE_KEY_NAME);
                if (localName && localName !== '' && localName !== 'undefined' && localName !== 'null') {
                    showMsg('离线模式 - 使用本地角色「' + localName + '」', 'info');
                    setTimeout(function() {
                        notifyGameComplete(localName, localStorage.getItem(STORAGE_KEY_GENDER) === '2' ? 'female' : 'male');
                    }, 500);
                } else {
                    setTimeout(enterCreateSection, 600);
                }
            });
        } else {
            showMsg(result.message || '登录失败，请检查用户名和密码', 'error');
        }
    })
    .catch(function(err){
        setLoading('loginBtn', false);
        showMsg('网络错误，无法连接到服务器', 'error');
    });
}

// ========= Register =========
function handleRegister() {
    var username = document.getElementById('regUsername').value.trim();
    var password = document.getElementById('regPassword').value.trim();
    var confirm = document.getElementById('regConfirm').value.trim();
    if (!username) { showMsg('请输入用户名', 'error'); return; }
    if (username.length < 2) { showMsg('用户名至少2个字符', 'error'); return; }
    if (!password) { showMsg('请输入密码', 'error'); return; }
    if (password.length < 4) { showMsg('密码至少4个字符', 'error'); return; }
    if (password !== confirm) { showMsg('两次密码输入不一致', 'error'); return; }
    hideMsg();
    setLoading('registerBtn', true);

    fetch(API_URL + '?action=register', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({username:username, password:password})
    })
    .then(function(r){return r.json();})
    .then(function(result){
        setLoading('registerBtn', false);
        if (result.code === 200) {
            showMsg('注册成功！请登录', 'success');
            document.getElementById('loginUsername').value = username;
            switchTab('loginTab');
        } else {
            showMsg(result.message || '注册失败', 'error');
        }
    })
    .catch(function(err){
        setLoading('registerBtn', false);
        showMsg('网络错误，无法连接到服务器', 'error');
    });
}

// ========= Skip Login (Offline Mode) =========
function skipLogin() {
    hideMsg();
    document.getElementById('loginSection').classList.remove('active');
    document.getElementById('createSection').classList.add('active');
    document.getElementById('loggedInUser').textContent = '欢迎，离线玩家';
    showMsg('离线模式 - 角色数据仅保存在本地', 'info');
}

// ========= Logout =========
function handleLogout() {
    var token = localStorage.getItem(STORAGE_KEY_TOKEN);
    if (token) {
        fetch(API_URL + '?action=logout', {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({token:token})
        }).catch(function(){});
    }
    localStorage.removeItem(STORAGE_KEY_TOKEN);
    localStorage.removeItem(STORAGE_KEY_USERNAME);
    localStorage.removeItem(STORAGE_KEY_NAME);
    localStorage.removeItem(STORAGE_KEY_GENDER);
    hideLoggedInBar();
    selectedGender = null;
    document.querySelectorAll('.gender-option').forEach(function(g){g.classList.remove('selected');});
    document.getElementById('characterName').value = '';
    switchTab('loginTab');
    document.getElementById('loginSection').classList.add('active');
    document.getElementById('createSection').classList.remove('active');
    showMsg('已退出登录', 'info');
}

// ========= Show Logged-in Bar =========
function showLoggedInBar(username) {
    var bar = document.getElementById('loggedInBar');
    var accountEl = document.getElementById('loggedInAccount');
    if (accountEl) accountEl.textContent = '已登录: ' + (username || localStorage.getItem(STORAGE_KEY_USERNAME));
    bar.style.display = 'flex';
}

function hideLoggedInBar() {
    document.getElementById('loggedInBar').style.display = 'none';
}

// ========= Enter Character Creation =========
function enterCreateSection() {
    document.getElementById('loginSection').classList.remove('active');
    document.getElementById('createSection').classList.add('active');
    document.getElementById('loggedInUser').textContent = '欢迎，' + localStorage.getItem(STORAGE_KEY_USERNAME);
    // 显示已登录账号提示（如果已登录）
    var username = localStorage.getItem(STORAGE_KEY_USERNAME);
    var token = localStorage.getItem(STORAGE_KEY_TOKEN);
    if (username && token && token !== 'undefined' && token !== 'null') {
        showLoggedInBar(username);
    }
    hideMsg();
}

// ========= Create Character =========
function handleCreateCharacter() {
    var name = document.getElementById('characterName').value.trim();
    if (!name) { showMsg('请输入角色名字', 'error'); return; }
    if (name.length < 2) { showMsg('角色名字至少2个字', 'error'); return; }
    if (name.length > 8) { showMsg('角色名字不能超过8个字', 'error'); return; }
    // 校验仅含中文字符
    if (!/^[一-龥]+$/.test(name)) {
        showMsg('角色名字只能包含中文字符', 'error'); return;
    }
    if (!selectedGender) { showMsg('请选择性别', 'error'); return; }
    hideMsg();
    setLoading('startBtn', true);

    var token = localStorage.getItem(STORAGE_KEY_TOKEN);
    if (!token) {
        setLoading('startBtn', false);
        showMsg('登录信息已过期，请重新登录', 'error');
        return;
    }

    // 先检查角色名是否可用
    var token = localStorage.getItem(STORAGE_KEY_TOKEN);
    if (token) {
        fetch(API_URL + '?action=checkCharacterName', {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({token:token, characterName:name})
        })
        .then(function(r){return r.json();})
        .then(function(avail){
            if (avail.code === 200 && avail.data && avail.data.available === true) {
                return fetch(API_URL + '?action=createCharacter', {
                    method: 'POST',
                    headers: {'Content-Type':'application/json'},
                    body: JSON.stringify({token:token, characterName:name})
                }).then(function(r){return r.json();});
            } else if (avail.code === 200 && avail.data && avail.data.available === false) {
                throw new Error('角色名已被占用，请换一个名字');
            } else {
                throw new Error(avail.message || '检查角色名失败');
            }
        })
        .then(function(result){
            setLoading('startBtn', false);
            if (result.code === 200) {
                localStorage.setItem(STORAGE_KEY_NAME, name);
                localStorage.setItem(STORAGE_KEY_GENDER, selectedGender === 'male' ? '1' : '2');
                showMsg('角色创建成功！正在进入游戏...', 'success');
                notifyGameComplete(name, selectedGender);
            } else {
                showMsg(result.message || '角色创建失败', 'error');
            }
        })
        .catch(function(err){
            console.warn('[MK] 服务器创建失败，使用本地模式:', err.message);
            completeLocal(name);
        });
    } else {
        completeLocal(name);
    }
}

function completeLocal(name) {
    setLoading('startBtn', false);
    localStorage.setItem(STORAGE_KEY_NAME, name);
    localStorage.setItem(STORAGE_KEY_GENDER, selectedGender === 'male' ? '1' : '2');
    showMsg('角色创建成功！（本地模式）', 'success');
    notifyGameComplete(name, selectedGender);
}

// ========= Notify Game =========
function notifyGameComplete(charName, gender) {
    // 通过postMessage通知父窗口
    if (window.parent && window.parent !== window) {
        window.parent.postMessage({
            type: 'mk_character_created',
            characterName: charName,
            gender: gender
        }, '*');
    }
    // 同时也设置localStorage标记
    localStorage.setItem('mk_character_ready', 'true');
    // 触发自定义事件（同域情况下）
    try {
        var event = new CustomEvent('mk_character_created', {
            detail: { characterName: charName, gender: gender }
        });
        window.dispatchEvent(event);
    } catch(e) {}
    // 尝试直接调用父窗口函数
    try {
        if (window.parent && window.parent.onMKCharacterCreated) {
            window.parent.onMKCharacterCreated(charName, gender);
        }
    } catch(e) {}
}

// ========= Check Login State =========
function checkLoginState() {
    var token = localStorage.getItem(STORAGE_KEY_TOKEN);
    var username = localStorage.getItem(STORAGE_KEY_USERNAME);
    var charName = localStorage.getItem(STORAGE_KEY_NAME);
    // 如果已有角色数据，直接通知完成（恢复已创建角色的状态）
    if (charName && charName !== 'undefined' && charName !== 'null' && charName !== '') {
        var gender = localStorage.getItem(STORAGE_KEY_GENDER) || '1';
        notifyGameComplete(charName, gender === '1' ? 'male' : 'female');
        return;
    }
    if (token && token !== 'undefined' && token !== 'null' && username) {
        // 显示已登录账号提示
        showLoggedInBar(username);
        // 已登录，先查询服务器是否有角色
        fetch(API_URL + '?action=checkCharacter', {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({token: token})
        })
        .then(function(r){return r.json();})
        .then(function(charResult){
            if (charResult.code === 200 && charResult.data && charResult.data.hasCharacter) {
                // 服务器有角色，直接进入游戏
                var existingName = charResult.data.characterName || username;
                localStorage.setItem(STORAGE_KEY_NAME, existingName);
                notifyGameComplete(existingName, 'male');
            } else if (charResult.code === 401) {
                // Token过期，清除本地状态，显示登录界面
                localStorage.removeItem(STORAGE_KEY_TOKEN);
                localStorage.removeItem(STORAGE_KEY_USERNAME);
                hideLoggedInBar();
                document.getElementById('loginSection').classList.add('active');
                showMsg('登录已过期，请重新登录', 'error');
            } else {
                // 服务器没有角色（返回200但hasCharacter=false）
                // 检查本地是否有角色名缓存（离线创建的情况）
                var localName = localStorage.getItem(STORAGE_KEY_NAME);
                if (localName && localName !== '' && localName !== 'undefined' && localName !== 'null') {
                    notifyGameComplete(localName, localStorage.getItem(STORAGE_KEY_GENDER) === '2' ? 'female' : 'male');
                } else {
                    enterCreateSection();
                }
            }
        })
        .catch(function(){
            // 网络请求失败，尝试使用本地角色名
            var localName = localStorage.getItem(STORAGE_KEY_NAME);
            if (localName && localName !== '' && localName !== 'undefined' && localName !== 'null') {
                notifyGameComplete(localName, localStorage.getItem(STORAGE_KEY_GENDER) === '2' ? 'female' : 'male');
            } else {
                enterCreateSection();
            }
        });
        return;
    }
    // 未登录，显示登录界面
    document.getElementById('loginSection').classList.add('active');
}

// ========= Submit on Enter =========
document.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
        var loginTab = document.getElementById('loginTab');
        var registerTab = document.getElementById('registerTab');
        var createSection = document.getElementById('createSection');
        if (loginTab.classList.contains('active')) {
            handleLogin();
        } else if (registerTab.classList.contains('active')) {
            handleRegister();
        } else if (createSection.classList.contains('active')) {
            handleCreateCharacter();
        }
    }
});

// ========= Handle messages from parent =========
window.addEventListener('message', function(event) {
    if (event.data && event.data.type === 'mk_check_ready') {
        var charName = localStorage.getItem(STORAGE_KEY_NAME);
        var ready = charName && charName !== '' && charName !== 'undefined' && charName !== 'null';
        event.source.postMessage({
            type: 'mk_ready_status',
            ready: ready,
            characterName: ready ? charName : null
        }, '*');
    }
});

// ========= Particles =========
function initParticles() {
    var container = document.getElementById('particles');
    for (var i = 0; i < 20; i++) {
        var p = document.createElement('div');
        p.className = 'particle';
        p.style.left = (Math.random() * 100) + '%';
        p.style.width = (2 + Math.random() * 4) + 'px';
        p.style.height = p.style.width;
        p.style.animationDuration = (10 + Math.random() * 20) + 's';
        p.style.animationDelay = (Math.random() * 15) + 's';
        p.style.opacity = 0.2 + Math.random() * 0.4;
        container.appendChild(p);
    }
}

// ========= Init =========
initParticles();
checkServer();
checkLoginState();
</script>
