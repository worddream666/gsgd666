<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>怪物国度 - 存档管理</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;user-select:none;}
body{
    font-family:'Microsoft YaHei','PingFang SC',sans-serif;
    background:linear-gradient(135deg,#0a0a1a 0%,#1a1a3e 50%,#0a0a1a 100%);
    min-height:100vh;color:#e0e8ff;overflow-x:hidden;
    background-attachment:fixed;
}
body::before{
    content:'';position:fixed;top:0;left:0;right:0;bottom:0;
    background:radial-gradient(ellipse at 50% 0%,rgba(60,120,255,0.06) 0%,transparent 60%);
    pointer-events:none;
}
.header{
    text-align:center;padding:clamp(16px,4vw,28px) 16px clamp(12px,3vw,20px);
    position:relative;
}
.header h1{
    font-size:clamp(22px,5vw,30px);font-weight:700;
    background:linear-gradient(135deg,#6eb4ff,#a78bfa,#6eb4ff);
    background-size:200% 200%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;
    background-clip:text;letter-spacing:3px;
    animation:gradientShift 3s ease infinite;
}
@keyframes gradientShift{0%,100%{background-position:0% 50%;}50%{background-position:100% 50%;}}
.header p{color:rgba(180,200,255,0.4);font-size:clamp(12px,2.5vw,14px);margin-top:4px;letter-spacing:4px;}
.header .account-info{
    position:absolute;top:clamp(10px,2vw,16px);right:clamp(12px,3vw,20px);
    font-size:clamp(11px,2vw,13px);color:rgba(180,200,255,0.6);
}
.header .account-info span{color:#5ceb8a;font-weight:600;}

.status-bar{
    display:flex;align-items:center;justify-content:center;gap:clamp(8px,2vw,16px);
    padding:clamp(8px,1.5vw,10px) clamp(12px,3vw,20px);
    margin:0 clamp(12px,3vw,20px) clamps(12px,2vw,16px);
    background:rgba(255,255,255,0.04);border-radius:10px;
    border:1px solid rgba(100,150,255,0.1);font-size:clamp(11px,2vw,13px);color:rgba(255,255,255,0.6);
    flex-wrap:wrap;
}
.status-dot{
    display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;
}
.status-dot.online{background:#4ade80;box-shadow:0 0 8px rgba(74,222,128,0.5);}
.status-dot.offline{background:#f87171;box-shadow:0 0 8px rgba(248,113,113,0.5);}
.status-dot.syncing{background:#fbbf24;animation:pulse 0.8s ease infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.4;}}

.slots-container{
    display:flex;flex-direction:column;gap:clamp(10px,2vw,14px);
    padding:clamp(12px,3vw,20px);
    max-width:clamp(340px,90vw,600px);margin:0 auto;
}
.slot-card{
    display:flex;align-items:center;gap:clamp(10px,2vw,16px);
    background:linear-gradient(145deg,rgba(255,255,255,0.06),rgba(255,255,255,0.02));
    border:1px solid rgba(100,150,255,0.12);
    border-radius:14px;padding:clamp(12px,2.5vw,18px) clamp(14px,3vw,20px);
    transition:all 0.3s ease;
    position:relative;overflow:hidden;
    cursor:pointer;
}
.slot-card:hover{border-color:rgba(100,150,255,0.3);background:rgba(255,255,255,0.08);transform:translateX(4px);}
.slot-card.has-data{border-color:rgba(100,180,255,0.2);}
.slot-card.has-data::before{
    content:'';position:absolute;left:0;top:0;bottom:0;width:3px;
    background:linear-gradient(180deg,#6eb4ff,#a78bfa);
    border-radius:0 3px 3px 0;
}
.slot-card .slot-number{
    width:clamp(40px,9vw,52px);height:clamp(40px,9vw,52px);
    border-radius:12px;display:flex;align-items:center;justify-content:center;
    font-size:clamp(18px,4vw,24px);font-weight:700;flex-shrink:0;
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(100,150,255,0.15);
}
.slot-card.has-data .slot-number{
    background:linear-gradient(135deg,rgba(60,120,255,0.2),rgba(167,139,250,0.2));
    border-color:rgba(100,150,255,0.3);
    color:#6eb4ff;
}
.slot-card .slot-info{flex:1;min-width:0;}
.slot-card .slot-title{
    font-size:clamp(14px,3vw,16px);font-weight:600;margin-bottom:4px;
}
.slot-card .slot-status{
    font-size:clamp(11px,2vw,12px);
    color:rgba(255,255,255,0.4);
}
.slot-card.has-data .slot-status{color:rgba(100,200,255,0.6);}
.slot-card .slot-actions{display:flex;gap:clamp(6px,1.2vw,10px);flex-shrink:0;}
.slot-btn{
    padding:clamp(6px,1.2vw,10px) clamp(12px,2.5vw,18px);
    border:none;border-radius:8px;font-size:clamp(12px,2.2vw,14px);
    font-weight:600;cursor:pointer;transition:all 0.3s;
    letter-spacing:1px;
}
.slot-btn.save{
    background:linear-gradient(135deg,#4a90d9,#6c5ce7);
    color:#fff;box-shadow:0 4px 16px rgba(74,144,217,0.25);
}
.slot-btn.save:hover{transform:translateY(-2px);box-shadow:0 6px 24px rgba(74,144,217,0.35);}
.slot-btn.save:active{transform:translateY(0);}
.slot-btn.load{
    background:rgba(255,255,255,0.08);
    color:rgba(180,200,255,0.8);border:1px solid rgba(100,150,255,0.2);
}
.slot-btn.load:hover{background:rgba(255,255,255,0.12);color:#fff;transform:translateY(-2px);}
.slot-btn.load:active{transform:translateY(0);}
.slot-btn.load.has-data{border-color:rgba(100,180,255,0.3);color:#6eb4ff;}
.slot-btn:disabled{opacity:0.4;cursor:not-allowed;transform:none !important;}
.slot-btn .spinner{
    display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,0.2);
    border-top-color:#fff;border-radius:50%;animation:spin 0.6s linear infinite;
    vertical-align:middle;margin-right:4px;
}
@keyframes spin{to{transform:rotate(360deg);}}

/* Loading state for slots */
.slot-card.loading{opacity:0.7;pointer-events:none;}
.slot-card.loading .slot-number{animation:pulse 0.8s ease infinite;}

/* Message toast */
.toast{
    position:fixed;top:clamp(12px,3vw,20px);left:50%;transform:translateX(-50%);
    padding:clamp(10px,2vw,14px) clamp(20px,4vw,32px);
    border-radius:10px;font-size:clamp(13px,2.5vw,15px);
    z-index:9999;display:none;
    animation:toastSlide 0.3s ease;
    box-shadow:0 8px 30px rgba(0,0,0,0.4);
}
@keyframes toastSlide{from{opacity:0;transform:translateX(-50%) translateY(-20px);}to{opacity:1;transform:translateX(-50%) translateY(0);}}
.toast.success{background:rgba(60,200,100,0.15);border:1px solid rgba(60,200,100,0.3);color:#5ceb8a;}
.toast.error{background:rgba(255,60,60,0.15);border:1px solid rgba(255,60,60,0.3);color:#ff6b6b;}
.toast.info{background:rgba(60,120,255,0.15);border:1px solid rgba(60,120,255,0.3);color:#6eb4ff;}

/* Confirm dialog overlay */
.confirm-overlay{
    position:fixed;z-index:9998;top:0;left:0;right:0;bottom:0;
    background:rgba(0,0,0,0.7);display:none;align-items:center;justify-content:center;
    animation:fadeInOverlay 0.2s ease;
}
@keyframes fadeInOverlay{from{opacity:0;}to{opacity:1;}}
.confirm-box{
    background:linear-gradient(145deg,#1a1a3e,#0f1f3f);
    border:1px solid rgba(100,150,255,0.2);border-radius:16px;
    padding:clamp(20px,4vw,30px);max-width:clamp(280px,80vw,400px);width:90%;
    text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.5);
}
.confirm-box h3{font-size:clamp(16px,3.5vw,20px);margin-bottom:12px;color:#fff;}
.confirm-box p{font-size:clamp(13px,2.5vw,15px);color:rgba(180,200,255,0.7);margin-bottom:20px;line-height:1.5;}
.confirm-box .confirm-actions{display:flex;gap:12px;justify-content:center;}
.confirm-box .confirm-actions button{
    padding:clamp(8px,2vw,12px) clamp(20px,5vw,32px);
    border:none;border-radius:10px;font-size:clamp(13px,2.5vw,15px);
    font-weight:600;cursor:pointer;transition:all 0.3s;
}
.confirm-box .confirm-actions .btn-yes{
    background:linear-gradient(135deg,#4a90d9,#6c5ce7);color:#fff;
    box-shadow:0 4px 16px rgba(74,144,217,0.3);
}
.confirm-box .confirm-actions .btn-yes:hover{transform:translateY(-2px);}
.confirm-box .confirm-actions .btn-no{
    background:rgba(255,255,255,0.06);color:rgba(180,200,255,0.7);
    border:1px solid rgba(100,150,255,0.15);
}
.confirm-box .confirm-actions .btn-no:hover{background:rgba(255,255,255,0.1);color:#fff;}

/* Bottom sync bar */
.sync-bar{
    position:fixed;bottom:0;left:0;right:0;
    background:rgba(15,20,40,0.95);
    border-top:1px solid rgba(100,150,255,0.1);
    padding:clamp(8px,2vw,12px) clamp(16px,4vw,24px);
    display:flex;align-items:center;justify-content:center;gap:clamp(8px,2vw,14px);
    font-size:clamp(11px,2vw,13px);color:rgba(255,255,255,0.5);
    flex-wrap:wrap;
}
.sync-bar .sync-btn{
    padding:clamp(6px,1.2vw,10px) clamp(14px,3vw,24px);
    border:none;border-radius:8px;background:rgba(60,120,255,0.12);
    color:#6eb4ff;font-size:clamp(11px,2vw,13px);cursor:pointer;
    border:1px solid rgba(60,120,255,0.2);transition:all 0.3s;
    font-weight:500;
}
.sync-bar .sync-btn:hover{background:rgba(60,120,255,0.2);transform:translateY(-1px);}
.sync-bar .sync-btn:disabled{opacity:0.4;cursor:not-allowed;transform:none !important;}
.sync-bar .last-sync{color:rgba(255,255,255,0.3);font-size:clamp(10px,1.5vw,11px);}

/* No login overlay */
.no-login-overlay{
    position:fixed;z-index:9997;top:0;left:0;right:0;bottom:0;
    background:rgba(0,0,0,0.85);display:flex;align-items:center;justify-content:center;
}
.no-login-box{text-align:center;padding:20px;}
.no-login-box h2{font-size:clamp(20px,5vw,28px);margin-bottom:16px;color:rgba(255,255,255,0.6);}
.no-login-box p{font-size:clamp(14px,3vw,16px);color:rgba(255,255,255,0.4);margin-bottom:20px;}
.no-login-box button{
    padding:12px 32px;border:none;border-radius:12px;
    background:linear-gradient(135deg,#4a90d9,#6c5ce7);color:#fff;
    font-size:16px;cursor:pointer;transition:all 0.3s;
}
.no-login-box button:hover{transform:translateY(-2px);box-shadow:0 6px 24px rgba(74,144,217,0.3);}

@media(max-width:480px){
    .slots-container{padding:10px;gap:8px;}
    .slot-card{padding:10px 12px;gap:10px;}
    .slot-card .slot-actions{flex-direction:column;gap:5px;}
    .slot-btn{padding:6px 12px;font-size:12px;}
    .sync-bar{gap:6px;}
}
</style>
</head>
<body>

<!-- Toast notification -->
<div id="toast" class="toast"></div>

<!-- Confirm dialog -->
<div id="confirmOverlay" class="confirm-overlay">
    <div class="confirm-box">
        <h3 id="confirmTitle">确认</h3>
        <p id="confirmText">确定要执行此操作吗？</p>
        <div class="confirm-actions">
            <button class="btn-yes" id="confirmYesBtn">确定</button>
            <button class="btn-no" onclick="hideConfirm()">取消</button>
        </div>
    </div>
</div>

<!-- No login overlay -->
<div id="noLoginOverlay" class="no-login-overlay" style="display:none;">
    <div class="no-login-box">
        <h2>🔒 未登录</h2>
        <p>请先登录后再管理存档</p>
        <button onclick="requestLogin()">前往登录</button>
    </div>
</div>

<!-- Header -->
<div class="header">
    <h1>存档管理</h1>
    <p>云端存档 · 随时存取</p>
    <div class="account-info" id="accountInfo">账号: <span id="accountName">--</span></div>
</div>

<!-- Status bar -->
<div class="status-bar">
    <span><span class="status-dot offline" id="statusDot"></span><span id="statusText">检测服务器...</span></span>
    <span id="gameStatus">游戏: <span id="gameConnected">未连接</span></span>
</div>

<!-- Save slots -->
<div class="slots-container" id="slotsContainer">
    <!-- Slots rendered by JS -->
</div>

<!-- Bottom sync bar -->
<div class="sync-bar">
    <span id="lastSyncText">未同步</span>
    <button class="sync-btn" id="refreshBtn" onclick="loadSlots()">🔄 刷新</button>
    <button class="sync-btn" onclick="syncAllToServer()">☁️ 全部上传</button>
    <button class="sync-btn" onclick="syncAllFromServer()">📥 全部下载</button>
</div>

<script>
// ============================
// Configuration
// ============================
// 服务器地址（部署时请修改为实际服务器地址）
var API_URL = '/api.php';
var STORAGE_KEY_TOKEN = 'mk_token';
var STORAGE_KEY_USERNAME = 'mk_username';
var STORAGE_KEY_NAME = 'mk_charactername';

// ============================
// State
// ============================
var token = '';
var username = '';
var charName = '';
var slots = [];
var isLoading = false;
var confirmCallback = null;
var gameAvailable = false;

// ============================
// Utility
// ============================
function showToast(text, type) {
    var el = document.getElementById('toast');
    el.textContent = text;
    el.className = 'toast ' + (type || 'info');
    el.style.display = 'block';
    clearTimeout(el._timer);
    el._timer = setTimeout(function() { el.style.display = 'none'; }, 3000);
}

function hideToast() {
    document.getElementById('toast').style.display = 'none';
}

function showConfirm(title, text, callback) {
    document.getElementById('confirmTitle').textContent = title;
    document.getElementById('confirmText').textContent = text;
    document.getElementById('confirmOverlay').style.display = 'flex';
    confirmCallback = callback;
    document.getElementById('confirmYesBtn').onclick = function() {
        hideConfirm();
        if (confirmCallback) confirmCallback();
    };
}

function hideConfirm() {
    document.getElementById('confirmOverlay').style.display = 'none';
    confirmCallback = null;
}

function setLoading(loading) {
    isLoading = loading;
    document.getElementById('refreshBtn').disabled = loading;
}

// ============================
// API
// ============================
function api(action, data) {
    data = data || {};
    if (token) data.token = token;
    if (username) data.username = username;
    return fetch(API_URL + '?action=' + action, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
    })
    .then(function(r) { return r.json(); })
    .catch(function(err) {
        return { code: 500, message: '网络错误: ' + err.message };
    });
}

// ============================
// Load Slots
// ============================
function loadSlots() {
    if (!token || isLoading) return;
    setLoading(true);
    document.getElementById('lastSyncText').textContent = '同步中...';

    api('listSaves').then(function(result) {
        setLoading(false);
        if (result.code === 200 && result.data && result.data.slots) {
            slots = result.data.slots;
            renderSlots();
            document.getElementById('lastSyncText').textContent = '上次同步: ' + new Date().toLocaleString();
        } else if (result.code === 401) {
            handleTokenExpired();
        } else {
            showToast(result.message || '加载存档失败', 'error');
            document.getElementById('lastSyncText').textContent = '同步失败';
        }
    });
}

// ============================
// Render Slots
// ============================
function renderSlots() {
    var container = document.getElementById('slotsContainer');
    var html = '';
    for (var i = 0; i < slots.length; i++) {
        var slot = slots[i];
        var slotNum = slot.slot || (i + 1);
        var hasData = slot.hasData;
        var updatedAt = slot.updatedAt || '';
        var displayTime = '';
        if (updatedAt) {
            try {
                var d = new Date(updatedAt);
                displayTime = d.toLocaleString();
            } catch(e) {
                displayTime = updatedAt;
            }
        }

        html += '<div class="slot-card' + (hasData ? ' has-data' : '') + '" data-slot="' + slotNum + '">';
        html += '    <div class="slot-number">' + slotNum + '</div>';
        html += '    <div class="slot-info">';
        html += '        <div class="slot-title">存档位 ' + slotNum + '</div>';
        html += '        <div class="slot-status">' + (hasData ? '📁 已存档' : '📭 空') + (displayTime ? ' · ' + displayTime : '') + '</div>';
        html += '    </div>';
        html += '    <div class="slot-actions">';
        html += '        <button class="slot-btn save" onclick="event.stopPropagation();saveToSlot(' + slotNum + ')">💾 保存</button>';
        html += '        <button class="slot-btn load' + (hasData ? ' has-data' : '') + '" onclick="event.stopPropagation();loadFromSlot(' + slotNum + ')"' + (!hasData ? ' disabled' : '') + '>📂 读档</button>';
        html += '    </div>';
        html += '</div>';
    }
    container.innerHTML = html;

    // Update account name
    var accEl = document.getElementById('accountName');
    if (accEl) accEl.textContent = charName || username || '--';
}

// ============================
// Save to Slot
// ============================
function saveToSlot(slotNum) {
    if (!token) { showToast('请先登录', 'error'); return; }
    if (isLoading) return;

    showConfirm('保存存档', '确定要保存到存档位 ' + slotNum + ' 吗？\n当前游戏数据将会覆盖该槽位。', function() {
        performSave(slotNum);
    });
}

function performSave(slotNum) {
    setLoading(true);
    showToast('正在保存...', 'info');

    // Try to get save data from game via postMessage
    var gotData = false;
    var saveData = null;

    // First, try to get save data from parent game
    try {
        if (window.parent && window.parent.postMessage) {
            window.parent.postMessage({ type: 'REQUEST_SAVE_DATA', slot: slotNum }, '*');
        }
    } catch (e) {}

    // Also try direct access to localStorage game data
    try {
        var gameSaveKey = 'savedata/gamedata' + slotNum + '.gcdata';
        var localSaveData = null;
        if (typeof localStorage !== 'undefined') {
            localSaveData = localStorage.getItem(gameSaveKey);
        }
        if (localSaveData) {
            saveData = localSaveData;
            gotData = true;
        }
    } catch (e) {}

    if (gotData && saveData) {
        // Upload save data to server
        api('saveGameData', {
            saveData: saveData,
            slot: slotNum
        }).then(function(result) {
            setLoading(false);
            if (result.code === 200) {
                showToast('已保存到存档位 ' + slotNum, 'success');
                loadSlots(); // Refresh slots list
                // Notify game that save was successful
                try {
                    window.parent.postMessage({
                        type: 'SAVE_COMPLETE',
                        slot: slotNum,
                        success: true
                    }, '*');
                } catch(e) {}
            } else if (result.code === 401) {
                handleTokenExpired();
            } else {
                showToast(result.message || '保存失败', 'error');
            }
        });
    } else {
        // No save data available locally, use server-side save approach
        // Tell the game to save first, then sync
        try {
            if (window.parent && window.parent.postMessage) {
                window.parent.postMessage({
                    type: 'TRIGGER_GAME_SAVE',
                    slot: slotNum
                }, '*');
                // Wait a bit for game to save, then sync to server
                setTimeout(function() {
                    // Try reading the save data again
                    try {
                        var gameSaveKey = 'savedata/gamedata' + slotNum + '.gcdata';
                        var localSaveData = localStorage.getItem(gameSaveKey);
                        if (localSaveData) {
                            api('saveGameData', {
                                saveData: localSaveData,
                                slot: slotNum
                            }).then(function(result) {
                                setLoading(false);
                                if (result.code === 200) {
                                    showToast('已保存到存档位 ' + slotNum, 'success');
                                    loadSlots();
                                } else {
                                    showToast(result.message || '保存失败', 'error');
                                }
                            });
                        } else {
                            // Save without actual data - server just marks the slot
                            api('saveGameData', {
                                saveData: '',
                                slot: slotNum
                            }).then(function(result) {
                                setLoading(false);
                                if (result.code === 200) {
                                    showToast('存档位已标记', 'info');
                                    loadSlots();
                                } else {
                                    showToast(result.message || '保存失败', 'error');
                                }
                            });
                        }
                    } catch(e) {
                        setLoading(false);
                        showToast('保存失败: ' + e.message, 'error');
                    }
                }, 1500);
            } else {
                setLoading(false);
                showToast('无法访问游戏，请先进入游戏', 'error');
            }
        } catch(e) {
            setLoading(false);
            showToast('保存失败: ' + e.message, 'error');
        }
    }
}

// ============================
// Load from Slot
// ============================
function loadFromSlot(slotNum) {
    if (!token) { showToast('请先登录', 'error'); return; }
    if (isLoading) return;

    showConfirm('读取存档', '确定要从存档位 ' + slotNum + ' 读取存档吗？\n未保存的进度将会丢失。', function() {
        performLoad(slotNum);
    });
}

function performLoad(slotNum) {
    setLoading(true);
    showToast('正在读取存档...', 'info');

    api('loadGameData', {
        slot: slotNum
    }).then(function(result) {
        if (result.code === 200 && result.data && result.data.hasData) {
            var saveData = result.data.saveData;

            if (saveData && saveData !== '') {
                // Write save data to LocalStorage (same format as engine)
                try {
                    var gameSaveKey = 'savedata/gamedata' + slotNum + '.gcdata';
                    localStorage.setItem(gameSaveKey, saveData);
                    // Also set the save preview data for the engine to find
                    localStorage.setItem('mk_save_loaded', 'true');
                    localStorage.setItem('mk_load_slot', slotNum.toString());
                } catch(e) {
                    console.warn('[SaveLoad] 写入本地存档失败:', e);
                }
            }

            setLoading(false);
            showToast('存档读取成功！正在加载...', 'success');

            // Notify game to load the save
            try {
                if (window.parent && window.parent.postMessage) {
                    window.parent.postMessage({
                        type: 'LOAD_SAVE_DATA',
                        slot: slotNum,
                        saveData: saveData || '',
                        hasData: true
                    }, '*');
                }
            } catch(e) {
                console.warn('[SaveLoad] 通知游戏加载失败:', e);
            }

            // If in game, try to trigger reload
            setTimeout(function() {
                try {
                    if (window.parent && window.parent.location) {
                        window.parent.location.reload();
                    }
                } catch(e) {}
            }, 500);

            loadSlots();
        } else if (result.code === 200 && (!result.data || !result.data.hasData)) {
            setLoading(false);
            showToast('该存档位没有数据', 'info');
        } else if (result.code === 401) {
            handleTokenExpired();
        } else {
            setLoading(false);
            showToast(result.message || '读取存档失败', 'error');
        }
    }).catch(function(err) {
        setLoading(false);
        showToast('读取失败: ' + err.message, 'error');
    });
}

// ============================
// Sync All
// ============================
function syncAllToServer() {
    if (!token || isLoading) return;
    showConfirm('上传所有存档', '确定要上传本地所有存档到云端吗？\n将上传存档位 1-5 的数据。', function() {
        performSyncAllToServer();
    });
}

function performSyncAllToServer() {
    setLoading(true);
    showToast('正在上传...', 'info');

    var uploadPromises = [];
    for (var i = 1; i <= 5; i++) {
        uploadPromises.push(
            (function(slotNum) {
                try {
                    var key = 'savedata/gamedata' + slotNum + '.gcdata';
                    var data = localStorage.getItem(key);
                    return api('saveGameData', {
                        saveData: data || '',
                        slot: slotNum
                    });
                } catch(e) {
                    return Promise.resolve({ code: 500, message: e.message });
                }
            })(i)
        );
    }

    Promise.all(uploadPromises).then(function(results) {
        setLoading(false);
        var successCount = results.filter(function(r) { return r.code === 200; }).length;
        showToast('上传完成: ' + successCount + '/5 成功', successCount > 0 ? 'success' : 'error');
        loadSlots();
    }).catch(function() {
        setLoading(false);
        showToast('上传失败', 'error');
    });
}

function syncAllFromServer() {
    if (!token || isLoading) return;
    showConfirm('下载所有存档', '确定要从云端下载所有存档到本地吗？\n将覆盖本地存档位 1-5 的数据。', function() {
        performSyncAllFromServer();
    });
}

function performSyncAllFromServer() {
    setLoading(true);
    showToast('正在下载...', 'info');

    var downloadPromises = [];
    for (var i = 1; i <= 5; i++) {
        downloadPromises.push(
            (function(slotNum) {
                return api('loadGameData', { slot: slotNum });
            })(i)
        );
    }

    Promise.all(downloadPromises).then(function(results) {
        var loaded = 0;
        for (var i = 0; i < results.length; i++) {
            var r = results[i];
            if (r.code === 200 && r.data && r.data.hasData && r.data.saveData) {
                try {
                    var key = 'savedata/gamedata' + (i + 1) + '.gcdata';
                    localStorage.setItem(key, r.data.saveData);
                    loaded++;
                } catch(e) {}
            }
        }
        setLoading(false);
        showToast('下载完成: ' + loaded + '/5', loaded > 0 ? 'success' : 'info');
        loadSlots();
    }).catch(function() {
        setLoading(false);
        showToast('下载失败', 'error');
    });
}

// ============================
// Auth
// ============================
function handleTokenExpired() {
    token = '';
    username = '';
    charName = '';
    showNoLogin();
    showToast('登录已过期，请重新登录', 'error');
}

function showNoLogin() {
    document.getElementById('noLoginOverlay').style.display = 'flex';
    document.getElementById('slotsContainer').innerHTML = '';
}

function hideNoLogin() {
    document.getElementById('noLoginOverlay').style.display = 'none';
}

function requestLogin() {
    // Try to open the create_actor page or redirect
    try {
        window.parent.postMessage({ type: 'MK_REQUEST_LOGIN' }, '*');
    } catch(e) {}
    showToast('请在游戏中登录', 'info');
}

// ============================
// Check Login & Init
// ============================
function checkLogin() {
    token = localStorage.getItem(STORAGE_KEY_TOKEN) || '';
    username = localStorage.getItem(STORAGE_KEY_USERNAME) || '';
    charName = localStorage.getItem(STORAGE_KEY_NAME) || '';

    if (!token || token === 'undefined' || token === 'null' || !username) {
        showNoLogin();
        updateConnectionStatus(false);
        return false;
    }

    // Verify token with server
    api('check').then(function(result) {
        if (result.code === 200) {
            hideNoLogin();
            updateConnectionStatus(true);
            loadSlots();
        } else {
            handleTokenExpired();
        }
    }).catch(function() {
        // Offline mode - try anyway
        hideNoLogin();
        updateConnectionStatus(false);
        loadSlots();
    });

    return true;
}

function updateConnectionStatus(online) {
    var dot = document.getElementById('statusDot');
    var text = document.getElementById('statusText');
    dot.className = 'status-dot ' + (online ? 'online' : 'offline');
    text.textContent = online ? '服务器已连接' : '服务器离线';
    document.getElementById('gameConnected').textContent = gameAvailable ? '已连接' : '未连接';
}

// ============================
// Message Handler
// ============================
window.addEventListener('message', function(event) {
    var msg = event.data || {};
    switch (msg.type) {
        case 'SAVE_DATA_RESPONSE':
            // Game responded with save data
            if (msg.saveData && msg.slot) {
                api('saveGameData', {
                    saveData: msg.saveData,
                    slot: msg.slot
                }).then(function(result) {
                    setLoading(false);
                    if (result.code === 200) {
                        showToast('已保存到存档位 ' + msg.slot, 'success');
                        loadSlots();
                    } else {
                        showToast(result.message || '保存失败', 'error');
                    }
                });
            }
            break;

        case 'GAME_STATE':
            // Game tells us it's available
            gameAvailable = true;
            document.getElementById('gameConnected').textContent = '已连接';
            break;

        case 'MK_LOGIN_STATE_CHANGED':
            // Login state changed in parent
            token = localStorage.getItem(STORAGE_KEY_TOKEN) || '';
            username = localStorage.getItem(STORAGE_KEY_USERNAME) || '';
            charName = localStorage.getItem(STORAGE_KEY_NAME) || '';
            if (token && token !== 'undefined' && token !== 'null') {
                hideNoLogin();
                checkLogin();
            } else {
                showNoLogin();
            }
            break;
    }
});

// Also periodically check game availability
setInterval(function() {
    try {
        if (window.parent && window.parent.Game) {
            gameAvailable = true;
            document.getElementById('gameConnected').textContent = '已连接';
        }
    } catch(e) {}
}, 3000);

// ============================
// Enter key support for confirm
// ============================
document.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
        var overlay = document.getElementById('confirmOverlay');
        if (overlay.style.display === 'flex') {
            hideConfirm();
            if (confirmCallback) confirmCallback();
        }
    }
    if (e.key === 'Escape') {
        hideConfirm();
    }
});

// ============================
// Init
// ============================
var inited = (function() {
    renderSlots();
    checkLogin();
    return true;
})();
</script>
