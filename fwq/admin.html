<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>怪兽国度 - 管理员后台</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #fff;
            padding: 20px;
        }
        .login-panel {
            max-width: 400px;
            margin: 100px auto;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 15px;
            padding: 30px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .login-panel h2 { margin-bottom: 20px; color: #e8e0f0; }
        .login-panel input {
            display: block;
            width: 100%;
            margin: 10px 0;
            padding: 12px 15px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 14px;
            outline: none;
        }
        .login-panel input::placeholder { color: #666; }
        .login-panel button {
            padding: 12px 40px;
            border-radius: 25px;
            border: none;
            background: linear-gradient(135deg, #5a2a9a, #3a5aba);
            color: #fff;
            font-size: 15px;
            cursor: pointer;
            margin-top: 10px;
        }
        .login-panel button:hover { opacity: 0.9; }
        .login-error { color: #f87171; font-size: 13px; margin-top: 10px; }

        /* 管理面板 */
        #adminPanel { display: none; }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .header h1 { color: #e8e0f0; font-size: 24px; }
        .header-right { display: flex; gap: 10px; align-items: center; }
        .header button {
            padding: 8px 20px;
            border-radius: 8px;
            border: none;
            background: #ef4444;
            color: #fff;
            cursor: pointer;
            font-size: 13px;
        }
        .header button:hover { opacity: 0.9; }

        /* 标签页 */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .tab-btn {
            padding: 10px 25px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.05);
            color: #aaa;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }
        .tab-btn:hover { background: rgba(255, 255, 255, 0.1); }
        .tab-btn.active {
            background: linear-gradient(135deg, #5a2a9a, #3a5aba);
            color: #fff;
            border-color: transparent;
        }

        /* 搜索和统计 */
        .search-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .search-bar input {
            flex: 1;
            padding: 12px 15px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 14px;
            outline: none;
        }
        .search-bar button {
            padding: 12px 20px;
            border-radius: 10px;
            border: none;
            background: linear-gradient(135deg, #5a2a9a, #3a5aba);
            color: #fff;
            cursor: pointer;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .stat-card .value { font-size: 24px; font-weight: bold; color: #c8b0e8; }
        .stat-card .label { font-size: 12px; color: #888; margin-top: 5px; }

        /* 用户列表 */
        .user-table, .message-table {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .user-table table, .message-table table { width: 100%; border-collapse: collapse; }
        .user-table th, .user-table td, .message-table th, .message-table td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .user-table th, .message-table th {
            background: rgba(255, 255, 255, 0.08);
            font-weight: 600;
            font-size: 13px;
            color: #aaa;
        }
        .user-table tr:hover, .message-table tr:hover { background: rgba(255, 255, 255, 0.03); }
        .user-table tr:last-child td, .message-table tr:last-child td { border-bottom: none; }
        .btn {
            padding: 4px 10px;
            border-radius: 5px;
            border: none;
            font-size: 12px;
            cursor: pointer;
            margin-right: 5px;
        }
        .btn-detail { background: #3b82f6; color: #fff; }
        .btn-delete { background: #ef4444; color: #fff; }
        .btn:hover { opacity: 0.8; }
        .status-online { color: #22c55e; font-size: 12px; }
        .status-offline { color: #6b7280; font-size: 12px; }

        /* 消息样式 */
        .message-content {
            max-width: 300px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .message-type { font-size: 11px; padding: 2px 6px; border-radius: 3px; }
        .type-public { background: #3b82f6; color: #fff; }
        .type-private { background: #22c55e; color: #fff; }

        /* 详情弹窗 */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-overlay.show { display: flex; }
        .modal {
            background: rgba(20, 20, 35, 0.95);
            border-radius: 15px;
            padding: 25px;
            width: 90%;
            max-width: 500px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-height: 80vh;
            overflow-y: auto;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .modal-header h3 { color: #e8e0f0; }
        .modal-header button {
            background: none;
            border: none;
            color: #666;
            font-size: 20px;
            cursor: pointer;
        }
        .modal-body .info-row {
            display: flex;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .modal-body .info-label { width: 120px; color: #888; font-size: 13px; }
        .modal-body .info-value { color: #e8e0f0; flex: 1; }
        .modal-body .info-value.hash { font-family: monospace; font-size: 11px; word-break: break-all; }

        /* 虚拟在线设置 */
        .setting-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 20px;
        }
        .setting-card h3 { color: #e8e0f0; margin-bottom: 15px; font-size: 16px; }
        .setting-row {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }
        .setting-row label { color: #aaa; font-size: 14px; min-width: 80px; }
        .setting-row input[type="number"] {
            width: 100px;
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 14px;
            outline: none;
        }
        .setting-row input[type="checkbox"] {
            width: 20px;
            height: 20px;
            accent-color: #5a2a9a;
        }
        .setting-row .toggle-label { color: #aaa; font-size: 14px; }
        .btn-save {
            padding: 10px 25px;
            border-radius: 8px;
            border: none;
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: #fff;
            cursor: pointer;
            font-size: 14px;
        }
        .btn-save:hover { opacity: 0.9; }

        /* 分页 */
        .pagination {
            display: flex;
            justify-content: center;
            gap: 5px;
            margin-top: 20px;
        }
        .pagination button {
            padding: 6px 12px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            cursor: pointer;
        }
        .pagination button:hover { background: rgba(255, 255, 255, 0.1); }
        .pagination button.active { background: #5a2a9a; }
        .pagination button:disabled { opacity: 0.3; cursor: not-allowed; }

        .empty-state { text-align: center; padding: 60px 20px; color: #666; }
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-top-color: #5a2a9a;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body>
    <!-- 登录面板 -->
    <div class="login-panel" id="loginPanel">
        <h2>🔒 管理员登录</h2>
        <input type="password" id="adminPassword" placeholder="请输入管理员密码" />
        <button onclick="adminLogin()">登录</button>
        <div class="login-error" id="loginError"></div>
    </div>

    <!-- 管理面板 -->
    <div id="adminPanel">
        <div class="header">
            <h1>👑 怪兽国度 - 管理员后台</h1>
            <div class="header-right">
                <button onclick="logout()">退出登录</button>
            </div>
        </div>

        <!-- 标签页 -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('users')">用户管理</button>
            <button class="tab-btn" onclick="switchTab('messages')">聊天记录</button>
            <button class="tab-btn" onclick="switchTab('notices')">系统通知</button>
            <button class="tab-btn" onclick="switchTab('settings')">系统设置</button>
        </div>

        <!-- 用户管理 -->
        <div class="tab-content active" id="tabUsers">
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="搜索用户名..." onkeyup="handleSearch()">
                <button onclick="loadUsers()">刷新</button>
            </div>

            <div class="stats" id="stats">
                <div class="stat-card"><div class="value" id="totalUsers">0</div><div class="label">总用户数</div></div>
                <div class="stat-card"><div class="value" id="onlineUsers">0</div><div class="label">在线用户</div></div>
                <div class="stat-card"><div class="value" id="hasCharacter">0</div><div class="label">已创建角色</div></div>
                <div class="stat-card"><div class="value" id="totalMessages">0</div><div class="label">消息总数</div></div>
            </div>

            <div class="user-table">
                <table>
                    <thead>
                        <tr>
                            <th>用户名</th>
                            <th>角色名</th>
                            <th>注册时间</th>
                            <th>最后登录</th>
                            <th>在线状态</th>
                            <th>IP地址</th>
                            <th>禁言状态</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="userTableBody">
                        <tr><td colspan="8" class="empty-state">加载中...</td></tr>
                    </tbody>
                </table>
            </div>
            <div class="pagination" id="userPagination"></div>
        </div>

        <!-- 聊天记录 -->
        <div class="tab-content" id="tabMessages">
            <div class="search-bar">
                <input type="text" id="msgSearchInput" placeholder="搜索消息内容、用户名..." onkeyup="loadMessages()">
                <button onclick="loadMessages()">刷新</button>
            </div>

            <div class="stats">
                <div class="stat-card"><div class="value" id="msgTotal">0</div><div class="label">消息总数</div></div>
            </div>

            <div class="message-table">
                <table>
                    <thead>
                        <tr>
                            <th>时间</th>
                            <th>发送者</th>
                            <th>角色名</th>
                            <th>类型</th>
                            <th>内容</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="msgTableBody">
                        <tr><td colspan="6" class="empty-state">加载中...</td></tr>
                    </tbody>
                </table>
            </div>
            <div class="pagination" id="msgPagination"></div>
        </div>

        <!-- 系统通知 -->
        <div class="tab-content" id="tabNotices">
            <div class="setting-card">
                <h3>📢 发送系统公告</h3>
                <div class="setting-row">
                    <label>公告内容</label>
                    <input type="text" id="noticeContent" placeholder="输入公告内容..." style="flex: 1; max-width: 400px;">
                </div>
                <div class="setting-row">
                    <label>字体颜色</label>
                    <input type="color" id="noticeColor" value="#ff0000">
                    <span id="colorPreview" style="color: #ff0000; margin-left: 10px;">预览</span>
                </div>
                <div class="setting-row">
                    <label>显示时长（秒）</label>
                    <input type="number" id="noticeDuration" value="4" min="1" max="60" style="width: 80px;">
                    <span style="margin-left: 10px; color: #666;">范围：1-60秒</span>
                </div>
                <div class="setting-row">
                    <button class="btn-save" onclick="sendNotice()">发送公告</button>
                    <span id="noticeStatus" style="color: #22c55e; margin-left: 15px;"></span>
                </div>
            </div>

            <div class="message-table">
                <table>
                    <thead>
                        <tr>
                            <th>时间</th>
                            <th>类型</th>
                            <th>内容</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="noticeTableBody">
                        <tr><td colspan="4" class="empty-state">加载中...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- 系统设置 -->
        <div class="tab-content" id="tabSettings">
            <div class="setting-card">
                <h3>🌐 虚拟在线人数设置</h3>
                <div class="setting-row">
                    <input type="checkbox" id="virtualEnabled">
                    <label class="toggle-label">启用虚拟在线人数</label>
                </div>
                <div class="setting-row">
                    <label>最小人数</label>
                    <input type="number" id="virtualMin" min="0" max="1000" value="0">
                </div>
                <div class="setting-row">
                    <label>最大人数</label>
                    <input type="number" id="virtualMax" min="0" max="1000" value="0">
                </div>
                <div class="setting-row">
                    <button class="btn-save" onclick="saveVirtualOnline()">保存设置</button>
                    <span id="virtualStatus" style="color: #22c55e; margin-left: 15px;"></span>
                </div>
            </div>
        </div>
    </div>

    <!-- 详情弹窗 -->
    <div class="modal-overlay" id="detailModal" onclick="closeModal()">
        <div class="modal" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h3>用户详情</h3>
                <button onclick="closeModal()">✕</button>
            </div>
            <div class="modal-body" id="modalBody"></div>
        </div>
    </div>

    <script>
        // 服务器地址（部署时请修改为实际服务器地址）
const API_URL = '/api.php';
        let adminToken = '';
        let currentPage = 1;
        let totalPages = 1;
        let msgCurrentPage = 1;
        let msgTotalPages = 1;

        async function api(action, data = {}) {
            try {
                if (adminToken) data.admin_token = adminToken;
                const response = await fetch(API_URL + '?action=' + action, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                return await response.json();
            } catch (error) {
                return { code: 500, message: '网络错误' };
            }
        }

        async function adminLogin() {
            const password = document.getElementById('adminPassword').value.trim();
            const errorEl = document.getElementById('loginError');
            
            if (!password) {
                errorEl.textContent = '请输入管理员密码';
                return;
            }

            const result = await api('adminLogin', { password });
            if (result.code === 200) {
                adminToken = result.data.token;
                document.getElementById('loginPanel').style.display = 'none';
                document.getElementById('adminPanel').style.display = 'block';
                loadUsers();
                loadVirtualOnline();
            } else {
                errorEl.textContent = result.message || '登录失败';
            }
        }

        function logout() {
            adminToken = '';
            document.getElementById('adminPanel').style.display = 'none';
            document.getElementById('loginPanel').style.display = 'block';
            document.getElementById('adminPassword').value = '';
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            
            if (tab === 'users') {
                document.querySelector('.tab-btn:nth-child(1)').classList.add('active');
                document.getElementById('tabUsers').classList.add('active');
            } else if (tab === 'messages') {
                document.querySelector('.tab-btn:nth-child(2)').classList.add('active');
                document.getElementById('tabMessages').classList.add('active');
                loadMessages();
            } else if (tab === 'notices') {
                document.querySelector('.tab-btn:nth-child(3)').classList.add('active');
                document.getElementById('tabNotices').classList.add('active');
                loadNotices();
            } else if (tab === 'settings') {
                document.querySelector('.tab-btn:nth-child(4)').classList.add('active');
                document.getElementById('tabSettings').classList.add('active');
            }
        }

        // ========== 用户管理 ==========
        async function loadUsers(page = 1) {
            const search = document.getElementById('searchInput').value.trim();
            const result = await api('getAllUsers', { page, search });
            
            if (result.code !== 200) {
                document.getElementById('userTableBody').innerHTML = 
                    '<tr><td colspan="7" class="empty-state">' + (result.message || '加载失败') + '</td></tr>';
                return;
            }

            const users = result.data.users || [];
            totalPages = result.data.totalPages || 1;
            currentPage = page;

            updateStats(result.data.stats, result.data.virtualEnabled);
            renderUserTable(users);
            renderUserPagination();
        }

        function updateStats(stats, virtualEnabled) {
            document.getElementById('totalUsers').textContent = stats.totalUsers || 0;
            // 如果启用虚拟在线，显示虚拟人数，否则显示真实在线人数
            const displayOnline = stats.displayOnlineUsers !== undefined ? stats.displayOnlineUsers : (stats.onlineUsers || 0);
            document.getElementById('onlineUsers').textContent = displayOnline;
            if (virtualEnabled) {
                document.getElementById('onlineUsers').title = '（虚拟在线人数）';
            }
            document.getElementById('hasCharacter').textContent = stats.hasCharacter || 0;
            document.getElementById('totalMessages').textContent = stats.totalMessages || 0;
        }

        function renderUserTable(users) {
            if (users.length === 0) {
                document.getElementById('userTableBody').innerHTML = 
                    '<tr><td colspan="8" class="empty-state">暂无用户</td></tr>';
                return;
            }

            let html = '';
            users.forEach(user => {
                const isOnline = user.isOnline === true;
                const isMuted = user.muted === true;
                const muteUntil = user.mute_until || 0;
                let muteStatus = '正常';
                if (isMuted) {
                    if (muteUntil > 0) {
                        const remaining = Math.ceil((muteUntil - Date.now() / 1000) / 60);
                        muteStatus = `<span style="color: #ef4444">禁言中 (${remaining}分钟)</span>`;
                    } else {
                        muteStatus = '<span style="color: #ef4444">永久禁言</span>';
                    }
                }
                
                html += `
                    <tr>
                        <td><strong>${escapeHtml(user.username)}</strong></td>
                        <td>${user.characterName || '-'}</td>
                        <td>${user.created_at || '-'}</td>
                        <td>${user.last_login || '-'}</td>
                        <td><span class="${isOnline ? 'status-online' : 'status-offline'}">${isOnline ? '在线' : '离线'}</span></td>
                        <td>${user.ip_address || '-'}</td>
                        <td>${muteStatus}</td>
                        <td>
                            <button class="btn btn-detail" onclick="showUserDetail('${user.username}')">详情</button>
                            ${isMuted ? `<button class="btn btn-detail" onclick="unmuteUser('${user.username}')">解除禁言</button>` : `<button class="btn btn-delete" onclick="muteUser('${user.username}')">禁言</button>`}
                            <button class="btn btn-delete" onclick="deleteUser('${user.username}')">删除</button>
                        </td>
                    </tr>
                `;
            });
            document.getElementById('userTableBody').innerHTML = html;
        }

        function renderUserPagination() {
            let html = '';
            const maxVisible = 5;
            let start = Math.max(1, currentPage - Math.floor(maxVisible / 2));
            let end = Math.min(totalPages, start + maxVisible - 1);
            
            if (currentPage > 1) {
                html += `<button onclick="loadUsers(${currentPage - 1})">上一页</button>`;
            }
            
            for (let i = start; i <= end; i++) {
                html += `<button ${i === currentPage ? 'class="active"' : ''} onclick="loadUsers(${i})">${i}</button>`;
            }
            
            if (currentPage < totalPages) {
                html += `<button onclick="loadUsers(${currentPage + 1})">下一页</button>`;
            }
            
            document.getElementById('userPagination').innerHTML = html;
        }

        function handleSearch() {
            currentPage = 1;
            loadUsers(1);
        }

        // ========== 聊天记录 ==========
        async function loadMessages(page = 1) {
            const search = document.getElementById('msgSearchInput').value.trim();
            const result = await api('getAllMessages', { page, search });
            
            if (result.code !== 200) {
                document.getElementById('msgTableBody').innerHTML = 
                    '<tr><td colspan="6" class="empty-state">' + (result.message || '加载失败') + '</td></tr>';
                return;
            }

            const messages = result.data.messages || [];
            msgTotalPages = result.data.totalPages || 1;
            msgCurrentPage = page;

            document.getElementById('msgTotal').textContent = result.data.total || 0;
            renderMsgTable(messages);
            renderMsgPagination();
        }

        function renderMsgTable(messages) {
            if (messages.length === 0) {
                document.getElementById('msgTableBody').innerHTML = 
                    '<tr><td colspan="6" class="empty-state">暂无消息</td></tr>';
                return;
            }

            let html = '';
            messages.forEach(msg => {
                const isPrivate = msg.to_user && msg.to_user !== 'all';
                html += `
                    <tr>
                        <td>${msg.created_at || '-'}</td>
                        <td>${escapeHtml(msg.from_user)}</td>
                        <td>${escapeHtml(msg.character_name || '-')}</td>
                        <td><span class="message-type ${isPrivate ? 'type-private' : 'type-public'}">${isPrivate ? '私聊' : '世界'}</span></td>
                        <td class="message-content" title="${escapeHtml(msg.content)}">${escapeHtml(msg.content)}</td>
                        <td><button class="btn btn-delete" onclick="deleteMessage('${msg.id}')">删除</button></td>
                    </tr>
                `;
            });
            document.getElementById('msgTableBody').innerHTML = html;
        }

        function renderMsgPagination() {
            let html = '';
            const maxVisible = 5;
            let start = Math.max(1, msgCurrentPage - Math.floor(maxVisible / 2));
            let end = Math.min(msgTotalPages, start + maxVisible - 1);
            
            if (msgCurrentPage > 1) {
                html += `<button onclick="loadMessages(${msgCurrentPage - 1})">上一页</button>`;
            }
            
            for (let i = start; i <= end; i++) {
                html += `<button ${i === msgCurrentPage ? 'class="active"' : ''} onclick="loadMessages(${i})">${i}</button>`;
            }
            
            if (msgCurrentPage < msgTotalPages) {
                html += `<button onclick="loadMessages(${msgCurrentPage + 1})">下一页</button>`;
            }
            
            document.getElementById('msgPagination').innerHTML = html;
        }

        async function deleteMessage(msgId) {
            if (!confirm('确定要删除这条消息吗？')) return;
            
            const result = await api('deleteMessage', { message_id: msgId });
            if (result.code === 200) {
                alert('删除成功');
                loadMessages(msgCurrentPage);
            } else {
                alert(result.message || '删除失败');
            }
        }

        // ========== 系统设置 ==========
        async function loadVirtualOnline() {
            const result = await api('getVirtualOnline');
            if (result.code === 200) {
                document.getElementById('virtualEnabled').checked = result.data.enabled;
                document.getElementById('virtualMin').value = result.data.min || 0;
                document.getElementById('virtualMax').value = result.data.max || 0;
            }
        }

        async function saveVirtualOnline() {
            const enabled = document.getElementById('virtualEnabled').checked;
            const min = parseInt(document.getElementById('virtualMin').value) || 0;
            const max = parseInt(document.getElementById('virtualMax').value) || 0;
            
            const result = await api('setVirtualOnline', { enabled, min, max });
            if (result.code === 200) {
                document.getElementById('virtualStatus').textContent = '保存成功!';
                setTimeout(() => {
                    document.getElementById('virtualStatus').textContent = '';
                }, 2000);
            } else {
                document.getElementById('virtualStatus').textContent = result.message || '保存失败';
                document.getElementById('virtualStatus').style.color = '#ef4444';
            }
        }

        // ========== 用户详情 ==========
        async function showUserDetail(username) {
            const result = await api('getUserDetail', { username });
            
            if (result.code !== 200) {
                alert(result.message || '获取失败');
                return;
            }

            const user = result.data;
            let html = `
                <div class="info-row"><div class="info-label">用户名</div><div class="info-value">${escapeHtml(user.username)}</div></div>
                <div class="info-row"><div class="info-label">密码哈希</div><div class="info-value hash">${escapeHtml(user.password || '')}</div></div>
                <div class="info-row"><div class="info-label">角色名</div><div class="info-value">${escapeHtml(user.characterName || '-')}</div></div>
                <div class="info-row"><div class="info-label">注册时间</div><div class="info-value">${user.created_at || '-'}</div></div>
                <div class="info-row"><div class="info-label">最后登录</div><div class="info-value">${user.last_login || '-'}</div></div>
                <div class="info-row"><div class="info-label">最后活跃</div><div class="info-value">${user.last_active ? formatTime(user.last_active) : '-'}</div></div>
                <div class="info-row"><div class="info-label">IP地址</div><div class="info-value">${user.ip_address || '-'}</div></div>
                <div class="info-row"><div class="info-label">等级</div><div class="info-value">${user.level || '-'}</div></div>
                <div class="info-row"><div class="info-label">金币</div><div class="info-value">${user.gold || '-'}</div></div>
                <div class="info-row"><div class="info-label">攻击</div><div class="info-value">${user.attack || '-'}</div></div>
                <div class="info-row"><div class="info-label">防御</div><div class="info-value">${user.defense || '-'}</div></div>
            `;
            
            document.getElementById('modalBody').innerHTML = html;
            document.getElementById('detailModal').classList.add('show');
        }

        function closeModal() {
            document.getElementById('detailModal').classList.remove('show');
        }

        async function deleteUser(username) {
            if (!confirm(`确定要删除用户 "${username}" 吗？此操作不可撤销！`)) {
                return;
            }

            const result = await api('deleteUser', { username });
            if (result.code === 200) {
                alert('删除成功');
                loadUsers(currentPage);
            } else {
                alert(result.message || '删除失败');
            }
        }

        // ========== 禁言管理 ==========
        async function muteUser(username) {
            const duration = prompt('请输入禁言时长（分钟，0表示永久禁言）:', '60');
            if (duration === null) return;
            
            const dur = parseInt(duration);
            if (isNaN(dur) || dur < 0) {
                alert('请输入有效的时长');
                return;
            }
            
            const result = await api('muteUser', { username, duration: dur });
            if (result.code === 200) {
                alert('禁言成功');
                loadUsers(currentPage);
            } else {
                alert(result.message || '禁言失败');
            }
        }

        async function unmuteUser(username) {
            const result = await api('unmuteUser', { username });
            if (result.code === 200) {
                alert('解除禁言成功');
                loadUsers(currentPage);
            } else {
                alert(result.message || '解除禁言失败');
            }
        }

        // ========== 系统通知 ==========
        async function loadNotices() {
            const result = await api('getSystemNotices');
            
            if (result.code !== 200) {
                document.getElementById('noticeTableBody').innerHTML = 
                    '<tr><td colspan="4" class="empty-state">' + (result.message || '加载失败') + '</td></tr>';
                return;
            }

            const notices = result.data || [];
            renderNoticeTable(notices);
        }

        function renderNoticeTable(notices) {
            if (notices.length === 0) {
                document.getElementById('noticeTableBody').innerHTML = 
                    '<tr><td colspan="4" class="empty-state">暂无公告</td></tr>';
                return;
            }

            let html = '';
            notices.forEach(notice => {
                const typeText = notice.type === 'monster_defeat' ? '怪物击败' : '系统公告';
                let content = '';
                if (notice.type === 'monster_defeat') {
                    content = `${notice.player_name} 击败了 ${notice.monster_name}！`;
                } else {
                    content = `<span style="color: ${notice.color || '#ff0000'}">${escapeHtml(notice.content)}</span>`;
                }
                
                html += `
                    <tr>
                        <td>${notice.created_at || '-'}</td>
                        <td>${typeText}</td>
                        <td>${content}</td>
                        <td><button class="btn btn-delete" onclick="deleteNotice('${notice.id}')">删除</button></td>
                    </tr>
                `;
            });
            document.getElementById('noticeTableBody').innerHTML = html;
        }

        async function sendNotice() {
            const content = document.getElementById('noticeContent').value.trim();
            const color = document.getElementById('noticeColor').value;
            const duration = parseInt(document.getElementById('noticeDuration').value) || 4;
            
            if (!content) {
                alert('请输入公告内容');
                return;
            }
            
            if (duration < 1 || duration > 60) {
                alert('显示时长必须在1-60秒之间');
                return;
            }
            
            const result = await api('sendSystemNotice', { content, color, duration });
            if (result.code === 200) {
                document.getElementById('noticeContent').value = '';
                document.getElementById('noticeDuration').value = '4';
                document.getElementById('noticeStatus').textContent = '发送成功!';
                setTimeout(() => {
                    document.getElementById('noticeStatus').textContent = '';
                }, 2000);
                loadNotices();
            } else {
                document.getElementById('noticeStatus').textContent = result.message || '发送失败';
                document.getElementById('noticeStatus').style.color = '#ef4444';
            }
        }

        async function deleteNotice(noticeId) {
            if (!confirm('确定要删除这条公告吗？')) return;
            
            const result = await api('deleteNotice', { notice_id: noticeId });
            if (result.code === 200) {
                alert('删除成功');
                loadNotices();
            } else {
                alert(result.message || '删除失败');
            }
        }

        // 颜色预览
        document.getElementById('noticeColor').addEventListener('input', function(e) {
            document.getElementById('colorPreview').style.color = e.target.value;
        });

        function escapeHtml(str) {
            if (!str) return '';
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function formatTime(timestamp) {
            if (!timestamp) return '-';
            const date = new Date(parseInt(timestamp) * 1000);
            return date.toLocaleString('zh-CN');
        }

        // 回车登录
        document.getElementById('adminPassword').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') adminLogin();
        });
    </script>
</body>
</html>
